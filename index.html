<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - PC Parts Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">PC PARTS STORE</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>

    <!-- Section Home -->
    <section id="home" class="home-section">
        <h1>Upgrade PC, <span class="highlight">Maksimalkan</span> Performa.</h1>
    </section>

    <!-- Section Collections -->
    <section id="products" class="collections-section">
        <h2>Products</h2>
        <div class="card-container">
            <div class="card">
                <img src="SSD.png" alt="SSD">
                <p>SSD</p>
            </div>
            <div class="card">
                <img src="RAM.png" alt="RAM">
                <p>RAM</p>
            </div>
            <div class="card">
                <img src="Prosesor.png" alt="Prosesor">
                <p>Prosesor</p>
            </div>
            <div class="card">
                <img src="KartuGrafis.png" alt="Kartu Grafis">
                <p>Kartu Grafis</p>
            </div>
        </div>
    </section>

    <section id="about" class="about-section">
        <h2>About</h2>
        <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
    </section>
</body>
</html>
